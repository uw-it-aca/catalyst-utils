[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-utils"
dynamic = ["version"]
description = "UW application that supports Catalyst archived files"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "UWIT Student & Educational Technology Services", email = "aca-it@uw.edu"}
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "django~=5.2",
    "django-userservice~=3.2",
    "django-storages[google]",
    "uw-memcached-clients~=1.1",
    "uw-restclients-core~=1.4",
    "uw-restclients-gws~=2.3",
    "uw-restclients-pws~=2.1",
    "uw-restclients-catalyst~=1.1",
    "uw-restclients-django-utils~=2.3",
    "uw-django-saml2~=1.8",
    "django-supporttools~=3.6",
    "django-persistent-message~=1.3",
    "psycopg[c]",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools]
packages = ["catalyst_utils"]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "catalyst_utils/VERSION"}

[tool.ruff]
line-length = 88
exclude = [
    "catalyst_utils/migrations/*",
    "catalyst_utils/test_migrations/*",
]

[tool.ruff.lint]
ignore = [
    "PERF402",
    "RUF012",  # allow mutable class attributes
]

[tool.coverage.run]
source = ["catalyst_utils"]
parallel = true
omit = [
     "catalyst_utils/migrations/*",
     "catalyst_utils/test_migrations/*",
     "catalyst_utils/tests/*"
]

[tool.coverage.paths]
source = [
    "catalyst_utils/",
    "/app/catalyst_utils/",
]
